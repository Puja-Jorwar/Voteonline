<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>National Election Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f9f9f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .form-container {
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
      }
      .form-container h1 {
        font-size: 24px;
        margin-bottom: 20px;
        text-align: center;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .form-group input[type="radio"] {
        width: auto;
        margin-right: 10px;
      }
      .form-group .radio-group {
        display: flex;
        flex-direction: column;
      }
      .form-group .radio-group label {
        display: flex;
        align-items: center;
        margin-bottom: 5px;
      }
      .form-group .radio-group label span {
        margin-left: 5px;
      }
      .submit-btn {
        display: block;
        width: 100%;
        padding: 10px;
        border: none;
        background-color: #007bff;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      .submit-btn:hover {
        background-color: #0056b3;
      }
      .note {
        font-size: 12px;
        text-align: center;
        margin-top: 10px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h1>Vote in the National Election</h1>
      <form action="#">
        <div class="form-group">
          <label for="voter-id">Voter ID</label>
          <input
            type="text"
            id="voter-id"
            name="voter-id"
            placeholder="Enter your voter ID"
            required
          />
        </div>
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input
            type="text"
            id="full-name"
            name="full-name"
            placeholder="Enter your full name"
            required
          />
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <input
            type="text"
            id="city"
            name="city"
            placeholder="Enter your city"
            required
          />
        </div>
        <div class="form-group">
          <label for="state">State</label>
          <input
            type="text"
            id="state"
            name="state"
            placeholder="Enter your state"
            required
          />
        </div>
        <div class="form-group">
          <label>Select a Candidate</label>
          <div class="radio-group">
            <label>
              <input
                type="radio"
                name="candidate"
                value="Narendra Modi"
                required
              />
              Narendra Modi (BJP) <span>🌷</span>
            </label>
            <label>
              <input type="radio" name="candidate" value="Rahul Gandhi" />
              Rahul Gandhi (Congress) <span>✋</span>
            </label>
            <label>
              <input type="radio" name="candidate" value="Arvind Kejriwal" />
              Arvind Kejriwal (AAP) <span>🧹</span>
            </label>
          </div>
        </div>
        <button type="submit" class="submit-btn">Submit Vote</button>
        <p class="note">
          Your vote will be securely stored on the blockchain and only you can
          access it.
        </p>
      </form>
    </div>
  </body>
</html>
